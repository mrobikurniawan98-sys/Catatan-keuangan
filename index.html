<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINAL - Catatan Keuangan</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f1f5f9;padding:10px}.top{background:#16a34a;color:#fff;text-align:center;padding:12px;border-radius:10px;font-weight:bold}.dark{background:#0f172a;color:#fff;border-radius:12px;padding:14px;margin-top:10px}.dark h3{margin:0 0 10px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#fff;color:#000;border-radius:8px;padding:10px;font-size:13px}.box b{font-size:14px}.card{background:#fff;border-radius:12px;padding:12px;margin-top:10px}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eee;font-size:14px}.row b{font-weight:bold}input,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #ddd}button{border:none;font-weight:bold;color:#fff;cursor:pointer}.hijau{background:#16a34a}.merah{background:#dc2626}.ungu{background:#7c3aed}.hitam{background:#0f172a}.orange{background:#f59e0b}.flex{display:flex;gap:5px}.flex button{font-size:12px}.bar{background:#e2e8f0;border-radius:20px;height:20px;overflow:hidden;margin:3px 0 8px}.fill{height:100%;color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}.item{border:1px solid #eee;border-radius:10px;padding:10px;margin-top:8px}.item img{width:100%;border-radius:8px;margin-top:5px}.mini{width:auto;padding:7px 10px;font-size:12px}.fotoBtn{background:#fff!important;color:#000!important;border:2px dashed #16a34a!important}.filterBtn{background:#fff!important;color:#000!important;border:1px solid #ddd!important}.filterBtn.on{background:#0f172a!important;color:#fff!important}</style></head><body>
<div class="top">✅ FINAL - CATATAN KEUANGAN</div>
<div class="dark"><div style="font-size:13px;color:#cbd5e1">Saldo</div><h3>Rp <span id="saldo">1.185.000</span></h3><div class="grid"><div class="box">📥 MASUK<br><b>Rp <span id="m1"></span></b></div><div class="box">📤 KELUAR<br><b>Rp <span id="k1"></span></b></div><div class="box">💰 SISA HUTANG<br><b>Rp <span id="h1"></span></b></div><div class="box">👥 NGUTANG<br><b><span id="n1"></span> orang</b></div></div></div>
<div class="card"><h3>📊 GRAFIK - BOROS DI MANA?</h3><b>Pengeluaran</b><div id="g1"></div><b>Sisa Hutang</b><div id="g2"></div></div>
<div class="card"><h3>📅 REKAP 1 BULAN</h3><div id="rekap"></div><div class="flex"><button class="ungu" onclick="notaWA()">📋 NOTA REKAP & WA</button><button class="hitam" onclick="window.print()">🖨️ PRINT</button></div></div>
<div class="card" style="border:2px solid #f59e0b"><h3 style="color:#dc2626">⚠️ ZONA BAHAYA</h3><button class="orange" onclick="hapusLunas()">HAPUS YANG UDAH LUNAS AJA</button><button class="merah" onclick="resetSemua()">RESET SEMUA DATA</button></div>
<div class="card"><h3>✏️ Catat Baru</h3><input id="ket" placeholder="Keterangan... Gajih"><input id="nom" type="number" placeholder="Nominal... 1375000"><button class="hijau" onclick="simpan('masuk')">+ SIMPAN PEMASUKAN</button><button class="merah" onclick="simpan('keluar')">- SIMPAN PENGELUARAN</button></div>
<div class="card" style="background:#f59e0b"><h3>🧾 Catat Hutang + WA + FOTO!</h3><input id="nama" placeholder="Nama... Andi"><input id="ketH" placeholder="Ngutang apa? Roko"><input id="tot" type="number" placeholder="Total... 31000"><input id="wa" placeholder="Nomor WA... 08123456789"><input type="file" id="foto" accept="image/*" style="display:none"><button class="fotoBtn" onclick="document.getElementById('foto').click()">📷 AMBIL FOTO BUKTI - KLIK DISINI!!</button><div id="fotoNama" style="text-align:center;font-size:12px;font-weight:bold"></div><button class="hijau" onclick="simpanHutang()">+ SIMPAN HUTANG + FOTO</button></div>
<div class="card"><h3>📋 Daftar Hutang - CARI + FOTO + CICIL + NOTA!</h3><input id="cari" placeholder="🔍 CARI NAMA... Budi / Zura / Roko" oninput="render()"><div class="flex"><button class="filterBtn on" id="fSemua" onclick="filter='semua';render()">⬛ SEMUA</button><button class="filterBtn" id="fBelum" onclick="filter='belum';render()">🔴 BELUM LUNAS</button><button class="filterBtn" id="fLunas" onclick="filter='lunas';render()">🟢 UDAH LUNAS</button></div><div id="jml" style="font-size:12px;color:#7c3aed;font-weight:bold"></div><div id="listH"></div></div>
<div class="card"><h3>📜 Riwayat</h3><div id="listR"></div></div>
<script>
var K='catatanV22';var d=JSON.parse(localStorage.getItem(K)||'null')||{pemasukan:0,pengeluaran:0,hutang:[],riwayat:[]};var filter='semua';
function save(){localStorage.setItem(K,JSON.stringify(d));render();}
function kat(t){t=(t||'').toLowerCase();if(t.includes('roko'))return 'Roko';if(t.includes('oli'))return 'Oli';if(t.includes('bensin'))return 'Bensin';if(t.includes('arisan'))return 'Arisan';if(t.includes('gajih')||t.includes('gaji'))return 'Gajih';if(t.includes('makan'))return 'Makan';return 'Lainnya';}
function gambar(data,el){var mx=1;for(var k in data)mx=Math.max(mx,data[k]);var h='';Object.keys(data).sort((a,b)=>data[b]-data[a]).forEach(k=>{var p=Math.max(8,Math.round(data[k]/mx*100));var c=k=='Roko'?'#dc2626':k=='Oli'?'#f59e0b':k=='Bensin'?'#2563eb':k=='Arisan'?'#7c3aed':k=='Gajih'?'#16a34a':'#64748b';h+='<b>'+k+'</b> - Rp '+data[k].toLocaleString('id-ID')+'<div class="bar"><div class="fill" style="width:'+p+'%;background:'+c+'">'+p+'%</div></div>';});document.getElementById(el).innerHTML=h||'Belum ada data';}
function simpan(a){var k=document.getElementById('ket').value.trim();var n=Number(document.getElementById('nom').value);if(!k||!n)return alert('Isi keterangan + nominal!');if(a=='masuk')d.pemasukan+=n;else d.pengeluaran+=n;d.riwayat.unshift({ket:k,nom:n,tipe:a,tgl:new Date().toLocaleString('id-ID')});document.getElementById('ket').value='';document.getElementById('nom').value='';save();alert('Tersimpan!');}
function simpanHutang(){var n=document.getElementById('nama').value.trim();var k=document.getElementById('ketH').value.trim();var t=Number(document.getElementById('tot').value);var w=document.getElementById('wa').value.trim();var f=document.getElementById('foto').files[0];if(!n||!k||!t)return alert('Isi nama + apa + total!');var done=function(foto){d.hutang.unshift({nama:n,ket:k,total:t,sisa:t,dibayar:0,wa:w,foto:foto||'',lunas:false});d.riwayat.unshift({ket:'Hutang '+n+' - '+k,nom:t,tipe:'hutang',tgl:new Date().toLocaleString('id-ID')});['nama','ketH','tot','wa'].forEach(id=>document.getElementById(id).value='');document.getElementById('fotoNama').innerText='';save();alert('Hutang '+n+' tersimpan!');};if(f){var r=new FileReader();r.onload=e=>done(e.target.result);r.readAsDataURL(f);}else done('');}
document.getElementById('foto').addEventListener('change',function(){if(this.files[0])document.getElementById('fotoNama').innerText='✅ Foto: '+this.files[0].name;});
function cicil(i){var s=Number(d.hutang[i].sisa)||0;var b=prompt('Bayar berapa? Sisa: Rp '+s.toLocaleString('id-ID'));var n=Number(b);if(!n)return;if(n>s)return alert('Kelebihan!');d.hutang[i].dibayar=(Number(d.hutang[i].dibayar)||(d.hutang[i].total-s))+n;d.hutang[i].sisa=s-n;d.hutang[i].lunas=d.hutang[i].sisa==0;save();}
function lunasin(i){if(!confirm('Lunasin '+d.hutang[i].nama+'?'))return;d.hutang[i].dibayar=d.hutang[i].total;d.hutang[i].sisa=0;d.hutang[i].lunas=true;save();}
function hapusH(i){if(!confirm('Hapus hutang '+d.hutang[i].nama+'?'))return;d.hutang.splice(i,1);save();}
function hapusR(i){if(!confirm('Hapus riwayat ini?'))return;d.riwayat.splice(i,1);save();}
function notaH(i){var h=d.hutang[i];var dib=(Number(h.dibayar)||(h.total-(Number(h.sisa)||0)));var sis=(Number(h.sisa)||0);var teks='NOTA HUTANG%0A%0ANama: '+h.nama+'%0AApa: '+h.ket+'%0ATotal: Rp '+h.total.toLocaleString('id-ID')+'%0ADibayar: Rp '+dib.toLocaleString('id-ID')+'%0ASisa: Rp '+sis.toLocaleString('id-ID')+'%0AStatus: '+(sis==0?'LUNAS':'BELUM LUNAS');if(h.wa)window.open('https://wa.me/'+h.wa.replace(/^0/,'62')+'?text='+teks);else{var t=prompt('Nomor WA nya? (08...)','');if(t)window.open('https://wa.me/'+t.replace(/^0/,'62')+'?text='+teks);}}
function notaWA(){var t='REKAP%0ASaldo: Rp '+(d.pemasukan-d.pengeluaran).toLocaleString('id-ID')+'%0AMasuk: Rp '+d.pemasukan.toLocaleString('id-ID')+'%0AKeluar: Rp '+d.pengeluaran.toLocaleString('id-ID')+'%0ASisa Hutang: Rp '+d.hutang.reduce((a,b)=>a+(Number(b.sisa)||0),0).toLocaleString('id-ID');window.open('https://wa.me/?text='+t);}
function hapusLunas(){if(!confirm('Hapus yang udah lunas aja?'))return;d.hutang=d.hutang.filter(h=>(Number(h.sisa)||0)>0);save();}
function resetSemua(){if(!confirm('HAPUS SEMUA DATA? Yakin?'))return;if(!confirm('BENERAN HAPUS SEMUA?'))return;localStorage.removeItem(K);location.reload();}
function render(){
var cari=(document.getElementById('cari')?document.getElementById('cari').value.toLowerCase():'');
var saldo=d.pemasukan-d.pengeluaran;document.getElementById('saldo').innerText=saldo.toLocaleString('id-ID');document.getElementById('m1').innerText=d.pemasukan.toLocaleString('id-ID');document.getElementById('k1').innerText=d.pengeluaran.toLocaleString('id-ID');var sisa=d.hutang.reduce((a,b)=>a+(Number(b.sisa)||0),0);document.getElementById('h1').innerText=sisa.toLocaleString('id-ID');document.getElementById('n1').innerText=d.hutang.length;
var p={};d.riwayat.forEach(r=>{if(r.tipe=='keluar'){var k=kat(r.ket);p[k]=(p[k]||0)+Number(r.nom);}});gambar(p,'g1');var h2={};d.hutang.forEach(h=>{var k=kat(h.ket+' '+h.nama);h2[k]=(h2[k]||0)+(Number(h.sisa)||0);});gambar(h2,'g2');
var dibTot=d.hutang.reduce((a,b)=>a+(Number(b.dibayar)||(Number(b.total)-(Number(b.sisa)||0))),0);
document.getElementById('rekap').innerHTML='<div class="row"><span>💰 Pemasukan</span><b>Rp '+d.pemasukan.toLocaleString('id-ID')+'</b></div><div class="row"><span>💸 Pengeluaran</span><b>Rp '+d.pengeluaran.toLocaleString('id-ID')+'</b></div><div class="row"><span>📈 Untung</span><b>Rp '+saldo.toLocaleString('id-ID')+'</b></div><div class="row"><span>⏳ Sisa Hutang</span><b>Rp '+sisa.toLocaleString('id-ID')+'</b></div><div class="row"><span>✅ Lunas / Cicil</span><b>Rp '+dibTot.toLocaleString('id-ID')+'</b></div>';
document.getElementById('fSemua').className='filterBtn '+(filter=='semua'?'on':'');document.getElementById('fBelum').className='filterBtn '+(filter=='belum'?'on':'');document.getElementById('fLunas').className='filterBtn '+(filter=='lunas'?'on':'');
var list=d.hutang.map((h,i)=>{var s=Number(h.sisa)||0;var dib=Number(h.dibayar)||(Number(h.total)-s);return {...h,idx:i,sisa:s,dibayar:dib,lunas:s==0};}).filter(h=>{if(filter=='belum'&&h.lunas)return false;if(filter=='lunas'&&!h.lunas)return false;if(cari&&!(h.nama.toLowerCase().includes(cari)||h.ket.toLowerCase().includes(cari)))return false;return true;});
document.getElementById('jml').innerText=list.length+' orang ketemu';
document.getElementById('listH').innerHTML=list.length?list.map(h=>'<div class="item"><b>'+h.nama+' - '+h.ket+'</b><br>Total: Rp '+h.total.toLocaleString('id-ID')+' | Sisa: <b>Rp '+h.sisa.toLocaleString('id-ID')+'</b> | Dibayar: Rp '+h.dibayar.toLocaleString('id-ID')+' | '+(h.lunas?'✅ LUNAS':'❌ BELUM LUNAS')+'<br>WA: '+h.wa+(h.foto?'<img src="'+h.foto+'">':'<br>📷 <i>gak ada foto bukti</i>')+'<br><button class="mini ungu" onclick="notaH('+h.idx+')">Nota & Tagih WA</button> <button class="mini orange" onclick="cicil('+h.idx+')">Cicil</button> <button class="mini hijau" onclick="lunasin('+h.idx+')">Lunasin</button> <button class="mini merah" onclick="hapusH('+h.idx+')">Hapus</button></div>').join(''):'<p>Belum ada hutang</p>';
document.getElementById('listR').innerHTML=d.riwayat.length?d.riwayat.slice(0,20).map((r,i)=>'<div class="item">'+r.tgl+' - '+r.ket+' - Rp '+r.nom.toLocaleString('id-ID')+' ('+r.tipe+') <button class="mini merah" onclick="hapusR('+i+')">Hapus</button></div>').join(''):'Belum ada riwayat';}
render();
</script>
</body>
</html>
