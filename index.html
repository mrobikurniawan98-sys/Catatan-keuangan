<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catatan Keuangan</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;margin:0;padding:10px}
.top{background:#22c55e;color:#000;padding:12px;border-radius:10px;font-weight:bold;text-align:center;font-size:18px}
.dark{background:#1e293b;padding:10px;border-radius:10px;margin-top:10px}
.card{background:#1e293b;padding:12px;border-radius:10px;margin-top:10px}
input,select,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:0;box-sizing:border-box;font-size:15px}
button{background:#22c55e;font-weight:bold;cursor:pointer}
button.o{background:#f59e0b} button.r{background:#ef4444;color:#fff} button.b{background:#3b82f6;color:#fff} button.g{background:#64748b;color:#fff}
img{max-width:100%;border-radius:8px;margin-top:5px}
video{width:100%;border-radius:8px;background:#000}
.bar{height:12px;background:#334155;border-radius:6px;overflow:hidden;margin:3px 0}
.bar>div{height:12px;background:#f59e0b}
.item{background:#0f172a;padding:10px;border-radius:8px;margin-top:8px}
small{color:#cbd5e1}
</style></head><body>
<div class="top">✅ FINAL - CATATAN KEUANGAN</div>
<div class="dark" id="saldo"></div>
<div class="card"><h3>📊 GRAFIK - BOROS DI MANA?</h3><div id="grafik"></div></div>
<div class="card"><h3>📅 REKAP 1 BULAN</h3><div id="rekap"></div></div>

<div class="card" style="border:2px solid #f59e0b"><h3>✏️ Catat Baru</h3>
<input id="ket" placeholder="Keterangan - misal: Gaji, Makan, Bensin">
<input id="nom" type="number" placeholder="Nominal Rp">
<select id="tipe"><option value="masuk">Pemasukan (+)</option><option value="keluar">Pengeluaran (-)</option></select>
<button onclick="simpan()">💾 SIMPAN CATATAN</button></div>

<div class="card" style="background:#f59e0b;color:#000"><h3>🧾 Catat Hutang + FOTO KAMERA</h3>
<input id="namaH" placeholder="Nama orang / Warung">
<input id="nomH" type="number" placeholder="Nominal Hutang Rp">
<input id="ketH" placeholder="Keterangan hutang">
<button class="b" onclick="bukaKamera()">📷 BUKA KAMERA LANGSUNG</button>
<video id="cam" autoplay playsinline style="display:none"></video>
<button id="btnJepret" class="b" onclick="jepret()" style="display:none">📸 JEPRET FOTO</button>
<canvas id="cv" style="display:none"></canvas>
<img id="prevFoto" style="display:none">
<p id="statusFoto" style="font-size:13px">Belum ada foto</p>
<button onclick="simpanHutang()">💾 SIMPAN HUTANG</button></div>

<div class="card"><h3>📋 Daftar Hutang - CARI + FOTO + CICIL</h3>
<input id="cariH" placeholder="🔍 Cari nama hutang..." oninput="render()">
<div id="listH"></div>
<button class="g" onclick="hapusLunas()">Hapus Yang Udah Lunas</button></div>

<div class="card"><h3>🧾 Riwayat</h3>
<input id="cari" placeholder="🔍 Cari riwayat..." oninput="render()">
<div id="listR"></div>
<button onclick="notaWA()">📲 Kirim Rekap ke WA</button>
<button class="r" onclick="resetSemua()">🗑️ HAPUS SEMUA DATA</button></div>

<script>
var K='catatanV22';
var d=JSON.parse(localStorage.getItem(K)||'{"pemasukan":0,"pengeluaran":0,"riwayat":[],"hutang":[]}');
var fotoTemp=''; var stream=null;
function save(){localStorage.setItem(K,JSON.stringify(d))}
function rp(n){return 'Rp '+(Number(n)||0).toLocaleString('id-ID')}
function kat(t){t=(t||'').toLowerCase();if(t.includes('makan')||t.includes('jajan')||t.includes('kopi'))return 'Makan';if(t.includes('bensin')||t.includes('bensin')||t.includes('ojek')||t.includes('parkir'))return 'Transport';if(t.includes('pulsa')||t.includes('kuota')||t.includes('listrik')||t.includes('air'))return 'Tagihan';if(t.includes('gaji')||t.includes('bonus')||t.includes('jual'))return 'Gaji / Jual';return 'Lainnya'}
function bukaKamera(){
  var v=document.getElementById('cam');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){stream=s;v.srcObject=s;v.style.display='block';document.getElementById('btnJepret').style.display='block';document.getElementById('statusFoto').innerText='Kamera aktif - arahkan & Jepret'}).catch(function(){alert('Kamera tidak bisa dibuka. Coba izinkan kamera di browser / pakai Chrome.')});
}
function jepret(){
  var v=document.getElementById('cam'); var c=document.getElementById('cv'); c.width=v.videoWidth||640; c.height=v.videoHeight||480;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  fotoTemp=c.toDataURL('image/jpeg',0.7);
  var p=document.getElementById('prevFoto'); p.src=fotoTemp; p.style.display='block';
  document.getElementById('statusFoto').innerText='✅ Foto berhasil dijepret!';
  if(stream) stream.getTracks().forEach(function(t){t.stop()});
  v.style.display='none'; document.getElementById('btnJepret').style.display='none';
}
function simpan(){
  var k=document.getElementById('ket').value, n=Number(document.getElementById('nom').value), t=document.getElementById('tipe').value;
  if(!k||!n) return alert('Isi keterangan & nominal dulu');
  if(t=='masuk') d.pemasukan+=n; else d.pengeluaran+=n;
  d.riwayat.unshift({ket:k,nom:n,tipe:t,tgl:new Date().toLocaleDateString('id-ID')});
  save(); document.getElementById('ket').value=''; document.getElementById('nom').value=''; render();
}
function simpanHutang(){
  var n=document.getElementById('namaH').value, nom=Number(document.getElementById('nomH').value), k=document.getElementById('ketH').value;
  if(!n||!nom) return alert('Isi nama & nominal hutang');
  d.hutang.push({nama:n,nom:nom,sisa:nom,dibayar:0,ket:k,foto:fotoTemp,tgl:new Date().toLocaleDateString('id-ID')});
  save(); fotoTemp=''; document.getElementById('prevFoto').style.display='none'; document.getElementById('statusFoto').innerText='Belum ada foto'; document.getElementById('namaH').value=''; document.getElementById('nomH').value=''; document.getElementById('ketH').value=''; render();
}
function cicil(i){
  var s=Number(d.hutang[i].sisa)||0; var b=Number(prompt('Bayar cicil berapa? Sisa: '+rp(s),''))||0;
  if(b<=0) return; if(b>s) b=s;
  d.hutang[i].dibayar+=b; d.hutang[i].sisa-=b; save(); render();
}
function lunasin(i){ if(!confirm('Lunasin '+d.hutang[i].nama+'?')) return; d.hutang[i].sisa=0; d.hutang[i].dibayar=d.hutang[i].nom; save(); render(); }
function hapusH(i){ if(!confirm('Hapus hutang '+d.hutang[i].nama+'?')) return; d.hutang.splice(i,1); save(); render(); }
function hapusR(i){ if(!confirm('Hapus riwayat ini?')) return; d.riwayat.splice(i,1); save(); render(); }
function hapusLunas(){ if(!confirm('Hapus yang udah lunas?')) return; d.hutang=d.hutang.filter(function(h){return h.sisa>0}); save(); render(); }
function resetSemua(){ if(!confirm('HAPUS SEMUA DATA? Yakin?')) return; localStorage.removeItem(K); location.reload(); }
function notaH(i){ var h=d.hutang[i]; var t='HUTANG%0A'+h.nama+'%0ANominal: '+rp(h.nom)+'%0ADibayar: '+rp(h.dibayar)+'%0ASisa: '+rp(h.sisa); window.open('https://wa.me/?text='+t); }
function notaWA(){ var t='REKAP%0ASaldo: '+rp(d.pemasukan-d.pengeluaran)+'%0AMasuk: '+rp(d.pemasukan)+'%0AKeluar: '+rp(d.pengeluaran); window.open('https://wa.me/?text='+t); }
function render(){
  var saldo=d.pemasukan-d.pengeluaran;
  document.getElementById('saldo').innerHTML='<div style="font-size:13px;color:#cbd5e1">SALDO SAAT INI</div><b style="font-size:24px">'+rp(saldo)+'</b><br><small>Masuk: '+rp(d.pemasukan)+' | Keluar: '+rp(d.pengeluaran)+'</small>';
  var p={}; d.riwayat.forEach(function(r){ if(r.tipe=='keluar'){ var k=kat(r.ket); p[k]=(p[k]||0)+r.nom }});
  var mx=1; for(var k in p) mx=Math.max(mx,p[k]);
  var g=''; for(var k in p) g+='<div>'+k+' - '+rp(p[k])+'</div><div class="bar"><div style="width:'+Math.round(p[k]/mx*100)+'%"></div></div>';
  document.getElementById('grafik').innerHTML=g||'Belum
